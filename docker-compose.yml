services:
  agente-voz:
    build:
      context: .
      dockerfile: Dockerfile
    image: agente-de-voz:latest
    container_name: agente-de-voz
    ports:
      - "${PORT:-8767}:${PORT:-8767}"
      - "${TLS_PORT:-8768}:${TLS_PORT:-8768}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8767}
      - TLS_PORT=${TLS_PORT:-8768}
      - OLLAMA_HOST=${OLLAMA_HOST}
      - OLLAMA_TEXT_MODEL=${OLLAMA_TEXT_MODEL:-qwen2.5:14b}
      - TRAEFIK_HOST=${TRAEFIK_HOST:-agente-voz.laliga.org.co}
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "2gb"
    volumes:
      - whisper-cache:/root/.cache/huggingface
      - ${TLS_CERT_HOST_PATH:-/home/aplicaciones/Documentos/Diego/Seguimientos/docker/traefik/certs/fullchain.pem}:/certs/fullchain.pem:ro
      - ${TLS_KEY_HOST_PATH:-/home/aplicaciones/Documentos/Diego/Seguimientos/docker/traefik/certs/certificado.key}:/certs/key.pem:ro
    restart: unless-stopped
    networks:
      - default
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.agente-voz.rule=Host(`${TRAEFIK_HOST:-agente-voz.laliga.org.co}`)
      - traefik.http.routers.agente-voz.entrypoints=websecure
      - traefik.http.routers.agente-voz.tls=true
      - traefik.http.services.agente-voz.loadbalancer.server.port=8767
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:$${PORT:-8767}/api/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

volumes:
  whisper-cache:

networks:
  traefik-public:
    external: true
